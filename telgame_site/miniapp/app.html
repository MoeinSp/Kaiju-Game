<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Kaiju Legends</title>
<script src="/app/tg.js"></script>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("/app/font/regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Vazirmatn"; src: url("/app/font/bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

  /* The app has ONE look (a dark lab HUD) on every device — it does not follow the
     Telegram theme, because the art is dark and the rarity colours are tuned for it. */
  :root {
    --bg: #080b12; --bg-2: #0d111b; --surface: #131927; --surface-2: #1a2233; --line: rgba(255,255,255,.07);
    --text: #eaf0ff; --muted: #8791a8; --faint: #5b6478;
    --accent: #3ad6ff; --accent-2: #8f6bff; --gold: #ffc857; --good: #35d48a; --warn: #ffab3d;
    --common: #9aa6ba; --rare: #4a94ff; --epic: #a96bff; --legendary: #ffbe3b; --mythic: #ff4d6d;
    --fire: #ff6b3d; --water: #3aa8ff; --earth: #c1915a; --electric: #ffd84a; --crystal: #7cf0e2; --plasma: #ff62d0;
    --tabs-h: 64px; --r: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14.5px/1.65 "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 18px);
    background:
      radial-gradient(900px 420px at 85% -120px, rgba(58,214,255,.13), transparent 60%),
      radial-gradient(700px 380px at 0% 0%, rgba(143,107,255,.12), transparent 60%),
      var(--bg);
    background-attachment: fixed; min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { padding: 12px 14px 0; max-width: 760px; margin: 0 auto; animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .b { font-weight: 700; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
  svg.i.f { fill: currentColor; stroke: none; }

  /* ── HUD ── */
  .hud { position: sticky; top: 0; z-index: 8; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(8,11,18,.78); border-bottom: 1px solid var(--line); }
  .hud .in { display: flex; gap: 7px; padding: 9px 14px; max-width: 760px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .hud .in::-webkit-scrollbar { display: none; }
  .res { flex: none; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 9px; border-radius: 999px; font-size: 13px; font-weight: 700;
         background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); }
  .res svg { width: 16px; height: 16px; }
  .res.coin svg { color: var(--gold); } .res.dna svg { color: #5ee6a8; } .res.dia svg { color: #6fd3ff; } .res.en svg { color: var(--electric); } .res.cup svg { color: #ffa94d; }
  .res small { color: var(--faint); font-weight: 400; }

  /* ── bottom nav ── */
  nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 10; height: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding: 0 10px env(safe-area-inset-bottom, 0px);
             background: rgba(13,17,27,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  nav.tabs .in { display: flex; height: var(--tabs-h); max-width: 760px; margin: 0 auto; }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--faint); position: relative; transition: color .2s; }
  nav.tabs button svg { width: 23px; height: 23px; transition: transform .2s; }
  nav.tabs button.on { color: var(--accent); font-weight: 700; }
  nav.tabs button.on svg { transform: translateY(-2px); filter: drop-shadow(0 0 8px rgba(58,214,255,.55)); }
  nav.tabs button.on::before { content: ""; position: absolute; top: 0; width: 34px; height: 3px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  /* ── building blocks ── */
  .panel { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--r); }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin: 20px 2px 10px; color: #cfd8ee; letter-spacing: .1px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(270deg, transparent, var(--line) 40%); }
  h2 svg { color: var(--accent); }
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 13%, transparent); }
  .tag svg { width: 13px; height: 13px; }
  .c-common { color: var(--common); } .c-rare { color: var(--rare); } .c-epic { color: var(--epic); } .c-legendary { color: var(--legendary); } .c-mythic { color: var(--mythic); }
  .e-fire { color: var(--fire); } .e-water { color: var(--water); } .e-earth { color: var(--earth); } .e-electric { color: var(--electric); } .e-crystal { color: var(--crystal); } .e-plasma { color: var(--plasma); }
  .stars { display: inline-flex; gap: 1px; color: #3a4357; } .stars svg { width: 13px; height: 13px; } .stars .on { color: var(--gold); filter: drop-shadow(0 0 3px rgba(255,200,87,.5)); }

  /* ── profile header ── */
  .lab { position: relative; overflow: hidden; padding: 16px; display: flex; align-items: center; gap: 14px; }
  .lab::before { content: ""; position: absolute; inset: 0; background-image: var(--art); background-size: cover; background-position: center 30%; filter: blur(18px) saturate(1.2); opacity: .32; transform: scale(1.2); }
  .lab::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,11,18,.2), rgba(8,11,18,.86)); }
  .lab > * { position: relative; z-index: 1; }
  .ring { width: 70px; height: 70px; flex: none; position: relative; }
  .ring svg { width: 70px; height: 70px; transform: rotate(-90deg); }
  .ring .lv { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .ring .lv b { font-size: 21px; } .ring .lv small { display: block; font-size: 9.5px; color: var(--muted); letter-spacing: .6px; }
  .lab .nm { font-size: 18px; font-weight: 700; line-height: 1.35; }
  .vip { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; font-size: 11.5px; font-weight: 700; color: var(--gold); }
  .vip svg { width: 13px; height: 13px; }

  /* ── hero creature ── */
  .hero { display: block; width: 100%; text-align: right; overflow: hidden; position: relative; }
  .hero .art { position: relative; aspect-ratio: 16 / 10; background: #05070c; }
  .hero .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(8,11,18,.94)); }
  .hero .over { position: absolute; inset: auto 14px 12px 14px; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .hero .ttl { font-size: 20px; font-weight: 700; line-height: 1.3; text-shadow: 0 2px 12px #000; }
  .pow { display: flex; flex-direction: column; align-items: center; min-width: 76px; padding: 6px 12px; border-radius: 12px; background: rgba(8,11,18,.72); border: 1px solid rgba(58,214,255,.35); box-shadow: 0 0 18px rgba(58,214,255,.18) inset; }
  .pow b { font-size: 19px; line-height: 1.2; color: var(--accent); } .pow small { font-size: 10px; color: var(--muted); }
  .hero .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 11px 14px 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 14px 14px; }
  .stat { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 7px; text-align: center; }
  .stat svg { width: 17px; height: 17px; } .stat b { display: block; font-size: 15px; line-height: 1.35; } .stat small { font-size: 10.5px; color: var(--muted); }
  .stat.hp svg { color: #ff5f7e; } .stat.atk svg { color: #ff9a3d; } .stat.def svg { color: #5aa9ff; } .stat.spd svg { color: #62e6b4; }

  /* ── info tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .info { display: flex; align-items: center; gap: 11px; padding: 12px; }
  .info .ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: color-mix(in srgb, currentColor 14%, transparent); }
  .info .ic svg { width: 20px; height: 20px; }
  .info small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; } .info b { font-size: 15px; color: var(--text); }
  .note { text-align: center; font-size: 11.5px; color: var(--faint); margin: 18px 0 0; }

  /* ── filters ── */
  .search { position: relative; margin-bottom: 10px; }
  .search svg { position: absolute; inset-inline-start: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--faint); }
  .search input { width: 100%; height: 44px; padding: 0 42px 0 14px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: rgba(58,214,255,.5); box-shadow: 0 0 0 3px rgba(58,214,255,.12); }
  .search input::placeholder { color: var(--faint); }
  .row { display: flex; gap: 7px; overflow-x: auto; padding: 1px 1px 9px; scrollbar-width: none; } .row::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13px; white-space: nowrap; color: var(--muted);
          background: var(--surface); border: 1px solid var(--line); transition: all .15s; }
  .chip svg { width: 15px; height: 15px; }
  .chip.on { color: #06131a; font-weight: 700; background: linear-gradient(135deg, var(--accent), #7fe6ff); border-color: transparent; box-shadow: 0 4px 16px rgba(58,214,255,.28); }
  .chip.on svg { color: #06131a; }
  .seg { display: flex; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; }
  .seg button { flex: 1; height: 32px; border-radius: 9px; font-size: 12.5px; color: var(--muted); transition: all .15s; }
  .seg button.on { background: var(--surface-2); color: var(--text); font-weight: 700; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; }
  .count { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 2px 2px 10px; }

  /* ── grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 10px; }
  .tile { position: relative; display: block; width: 100%; text-align: right; border-radius: 14px; overflow: hidden; background: var(--surface); isolation: isolate;
          box-shadow: 0 0 0 1.5px var(--rc, var(--line)); transition: transform .12s; }
  .tile:active { transform: scale(.96); }
  .tile.common { --rc: color-mix(in srgb, var(--common) 55%, transparent); } .tile.rare { --rc: var(--rare); } .tile.epic { --rc: var(--epic); }
  .tile.legendary { --rc: var(--legendary); box-shadow: 0 0 0 1.5px var(--rc), 0 6px 22px rgba(255,190,59,.22); }
  .tile.mythic { --rc: var(--mythic); box-shadow: 0 0 0 1.5px var(--rc), 0 6px 24px rgba(255,77,109,.3); }
  .tile .pic { aspect-ratio: 1 / 1; width: 100%; object-fit: cover; display: block; background: #05070c; }
  .tile .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,11,18,.25) 0%, transparent 28%, transparent 46%, rgba(8,11,18,.96) 100%); pointer-events: none; }
  .tile .body { position: absolute; inset: auto 8px 7px 8px; }
  .tile .nm { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px #000; }
  .tile .sub { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #c5cee2; margin-top: 1px; }
  .tile .sub .p { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--accent); } .tile .sub .p svg { width: 11px; height: 11px; }
  .tile .stars svg { width: 10px; height: 10px; }
  .el { position: absolute; top: 7px; inset-inline-end: 7px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: rgba(8,11,18,.74); border: 1px solid color-mix(in srgb, currentColor 55%, transparent); }
  .el svg { width: 14px; height: 14px; }
  .flag { position: absolute; top: 7px; inset-inline-start: 7px; display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; color: #04130c; }
  .flag svg { width: 11px; height: 11px; } .flag.act { background: var(--good); } .flag.busy { background: var(--warn); }
  .lvl { position: absolute; top: 7px; inset-inline-end: 7px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; background: rgba(8,11,18,.78); border: 1px solid var(--rc, var(--line)); }

  /* ── leaderboard ── */
  .podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 9px; align-items: end; margin-bottom: 12px; }
  .pod { padding: 12px 8px 11px; text-align: center; position: relative; overflow: hidden; }
  .pod::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: currentColor; }
  .pod.g { color: var(--gold); padding-top: 18px; } .pod.s { color: #c8d3e6; } .pod.z { color: #d58a4f; }
  .pod .medal { width: 40px; height: 40px; margin: 0 auto 6px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, currentColor 16%, transparent); border: 1.5px solid currentColor; font-weight: 700; font-size: 16px; }
  .pod.g .medal { width: 48px; height: 48px; font-size: 19px; box-shadow: 0 0 22px rgba(255,200,87,.35); }
  .pod .nm { color: var(--text); font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .cp { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; margin-top: 2px; } .pod .cp svg { width: 13px; height: 13px; }
  .mine { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; border-color: rgba(58,214,255,.35); background: linear-gradient(135deg, rgba(58,214,255,.12), rgba(143,107,255,.08)); }
  .mine .rk { font-size: 22px; font-weight: 700; color: var(--accent); min-width: 44px; text-align: center; }
  .lb > div { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .lb > div:last-child { border-bottom: 0; }
  .lb .rk { width: 26px; text-align: center; font-weight: 700; color: var(--muted); }
  .lb .lg { width: 22px; height: 22px; flex: none; } .lb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .cp { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; } .lb .cp svg { width: 14px; height: 14px; color: #ffa94d; }
  .lb .me { background: rgba(58,214,255,.09); }
  .lg-bronze { color: #d58a4f; } .lg-silver { color: #c8d3e6; } .lg-gold { color: var(--gold); } .lg-plat { color: #7fe6ff; } .lg-diamond { color: #8fb4ff; }
  .lg-master { color: var(--epic); } .lg-legend { color: #ff8a5c; } .lg-champion { color: var(--mythic); }

  /* ── sheet ── */
  .sheet { position: fixed; inset: 0; z-index: 30; visibility: hidden; }
  .sheet .scrim { position: absolute; inset: 0; background: rgba(4,6,10,.72); opacity: 0; transition: opacity .22s; }
  .sheet .box { position: absolute; inset: auto 0 0 0; max-height: 92vh; overflow-y: auto; max-width: 760px; margin: 0 auto; background: var(--bg-2); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
                transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet.open { visibility: visible; } .sheet.open .scrim { opacity: 1; } .sheet.open .box { transform: none; }
  .sheet .art { position: relative; background: #05070c; } .sheet .art img { width: 100%; display: block; max-height: 56vh; object-fit: cover; }
  .sheet .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--bg-2)); }
  .sheet .x { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: rgba(8,11,18,.72); border: 1px solid var(--line); }
  .sheet .x svg { width: 18px; height: 18px; }
  .sheet .pad { padding: 0 16px; margin-top: -30px; position: relative; z-index: 1; }
  .sheet .ttl { font-size: 22px; font-weight: 700; line-height: 1.35; }
  .sheet .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 8px 0 4px; }
  .list > div { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-bottom: 1px solid var(--line); } .list > div:last-child { border-bottom: 0; }
  .list .ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; background: color-mix(in srgb, currentColor 14%, transparent); } .list .ic svg { width: 18px; height: 18px; }
  .list .t { flex: 1; min-width: 0; color: var(--text); } .list .t small { display: block; color: var(--muted); font-size: 11.5px; }

  /* ── states ── */
  .state { text-align: center; padding: 64px 22px; color: var(--muted); }
  .state .big { width: 68px; height: 68px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); color: var(--accent); }
  .state .big svg { width: 32px; height: 32px; } .state b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 22px; border-radius: 13px; font-weight: 700; color: #06131a; background: linear-gradient(135deg, var(--accent), #7fe6ff); margin-top: 16px; }
  .sk { border-radius: var(--r); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 220% 100%; animation: sh 1.2s linear infinite; }
  @keyframes sh { to { background-position: -220% 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="hud"><div class="in" id="hud"></div></div>
<div class="wrap" id="view"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="box" id="sheet-box"></div></div>

<script>
(function () {
  "use strict";

  // ── icon set (drawn for this app; 24×24, stroke = currentColor) ──
  var ICONS = {
    coin: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.6v8.8M14.6 9.7c-.5-1-1.5-1.5-2.7-1.5-1.5 0-2.6.8-2.6 2s.9 1.7 2.7 1.9c1.800.2 2.700.8 2.700 2s-1.200 2-2.700 2c-1.300 0-2.400-.6-2.800-1.600"/>',
    dna: '<path d="M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9M8.600 6.500h6.800M8.600 17.500h6.800M10 12h4"/>',
    gem: '<path d="M6.500 4h11l3.500 5-9 11L3 9z"/><path d="M3 9h18M9 4l-1.500 5 4.500 11 4.500-11L15 4"/>',
    bolt: '<path d="M13.500 2.500 5 13.500h6l-1 8 8.500-11h-6z"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 5.500H5a3 3 0 0 0 3 4.300M16 5.500h3a3 3 0 0 1-3 4.300M12 13v4M8.500 20.500h7M10 17h4l.6 3.500H9.400z"/>',
    heart: '<path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10z"/>',
    sword: '<path d="M19.500 3.500 9 14M19.500 3.500l-4.500.6L6.800 12.300 9 14.500l1.700 2.200 8.200-8.200zM6 13l5 5M4 20l3.500-3.500M5.200 17.400l1.400 1.400"/>',
    shield: '<path d="M12 3 5 5.800v5.700c0 4.500 3 7.900 7 9.500 4-1.600 7-5 7-9.500V5.800z"/><path d="m9.200 12 2 2 3.600-4"/>',

  function ic(name, cls) { return '<svg class="i ' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>"; }

    function pod(r, cls) { return r ? '<div class="panel pod ' + cls + '"><div class="medal num">' + r.rank + '</div><div class="nm">' + esc(r.name) + '</div><div class="cp">' + ic("trophy") + n(r.cup) + "</div></div>" : "<div></div>"; }
    html += '<div class="panel mine"><span class="rk num">#' + Number(data.me.rank).toLocaleString("en-US") + '</span><span style="flex:1;min-width:0"><div class="b" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(data.me.name) + '</div><small class="muted">رتبه‌ی تو در جدول کاپ</small></span>' +
      '<span class="b" style="display:inline-flex;align-items:center;gap:5px;color:#ffa94d">' + ic("trophy") + n(data.me.cup) + "</span></div>";
    if (top.length) html += '<div class="podium">' + pod(top[1], "s") + pod(top[0], "g") + pod(top[2], "z") + "</div>";
    if (rest.length) {
      html += '<div class="panel lb">';
      rest.forEach(function (r) {
        html += '<div class="' + (r.me ? "me" : "") + '"><span class="rk num">' + r.rank + '</span><svg class="i lg lg-' + leagueTier(r.league) + '" viewBox="0 0 24 24">' + ICONS.medal + '</svg><span class="nm">' + esc(r.name) + '</span><span class="cp">' + ic("trophy") + n(r.cup) + "</span></div>";
      });
      html += "</div>";
    }
    view.innerHTML = html;
  }

  // ── sheet ──
  var sheet = document.getElementById("sheet"), box = document.getElementById("sheet-box");
  function openSheet(html) { box.innerHTML = '<button class="x" data-close aria-label="بستن">' + ic("close") + "</button>" + html; box.scrollTop = 0; sheet.classList.add("open"); tap(); }
  sheet.addEventListener("click", function (ev) { if (ev.target.closest("[data-close]")) sheet.classList.remove("open"); });

  // ── routing ──
  var TABS = [["profile", "flask", "آزمایشگاه"], ["creatures", "claw", "هیولاها"], ["equipment", "chest", "تجهیزات"], ["leaderboard", "podium", "جدول"]];
  var renderers = { profile: profile, creatures: creatures, equipment: equipment, leaderboard: leaderboard };
  var sources = { profile: "me", creatures: "creatures", equipment: "equipment", leaderboard: "leaderboard" };
  var tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = TABS.map(function (t) { return '<button data-tab="' + t[0] + '">' + ic(t[1]) + "<span>" + t[2] + "</span></button>"; }).join("");

  function show(name) {
    tab = name;
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.classList.toggle("on", b.dataset.tab === name); });
    if (!cache[sources[name]]) view.innerHTML = skeleton(name === "creatures" || name === "equipment" ? "grid" : "");
    api("me").then(function (me) {
      meta = me.meta; renderHud(me);
      return name === "profile" ? me : api(sources[name]);
    }).then(function (data) {
      if (tab !== name) return;
      view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
      renderers[name](data); window.scrollTo(0, 0);
    }).catch(fail);
  }
  tabsEl.addEventListener("click", function (ev) { var b = ev.target.closest("button[data-tab]"); if (b && b.dataset.tab !== tab) { tap(); show(b.dataset.tab); } });
  view.addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    var d = t.dataset;
    if (d.creature) {
      var id = Number(d.creature), c = null;
      if (cache.creatures) c = cache.creatures.creatures.filter(function (x) { return x.id === id; })[0];
      if (!c && cache.me && cache.me.active && cache.me.active.id === id) c = cache.me.active;
      if (c) creatureSheet(c);
    } else if (d.equip) {
      var e = cache.equipment.equipment.filter(function (x) { return x.id === Number(d.equip); })[0];
      if (e) equipSheet(e);
    } else if ("rarity" in d) { tap(); filt.creatures.rarity = d.rarity; creatures(cache.creatures); }
    else if ("element" in d) { tap(); filt.creatures.element = d.element; creatures(cache.creatures); }
    else if ("sort" in d) { tap(); filt.creatures.sort = d.sort; creatures(cache.creatures); }
    else if ("slot" in d) { tap(); filt.equipment.slot = d.slot; equipment(cache.equipment); }
    else if ("erarity" in d) { tap(); filt.equipment.rarity = d.erarity; equipment(cache.equipment); }
  });
  show("profile");
})();
</script>
</body>
</html>
